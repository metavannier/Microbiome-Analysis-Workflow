# ======================================================================
#   Configuration of the microbiome workflow - project undernutrition
# ======================================================================

# Sample sheets
metadata: "sample-metadata.tsv"    # QIIME 2 sample metadata
manifest: "manifest.tsv"           # QIIME 2 manifest (03_Script/make_manifest.py)
comparisons: "comparisons.tsv"     # comparisons to analyse (one report each)

# Comparisons to run: "all", "none" (common part only) or comparison IDs
# separated by commas. Usually given on the command line:
#   ./run_workflow.sh run L1_Feces_Female_CTL_vs_SAM
#   snakemake ... --config run_comparisons=L1_Feces_Female_CTL_vs_SAM
run_comparisons: "all"

# Directory for the QIIME 2 temporary files. It needs space: the weighted
# SILVA classifier is unpacked twice there (~40 GB free needed), more than
# /tmp has on most servers. Default: "tmp" in the project directory
# (relative paths are relative to the project). Empty = system default
# ($TMPDIR or /tmp). A directory outside the project is bound in Apptainer
# by run_workflow.sh.
tmpdir: "tmp"

project:
    # Project name (prefix of the output files)
    name: "undernutrition"
    # Raw paired-end reads: <sample>_S<n>_L001_R1_001.fastq.gz / _R2_001.fastq.gz
    raw_dir: "00_RowData"
    r1_suffix: "_R1_001.fastq.gz"
    r2_suffix: "_R2_001.fastq.gz"
    # QIIME 2 import (see manifest.tsv)
    type: "SampleData[PairedEndSequencesWithQuality]"
    format: "PairedEndFastqManifestPhred33V2"
    # Samples to leave out of every comparison (e.g. failed libraries)
    exclude_samples: []

# Software: containers used with --sdm apptainer (the conda environments of
# 02_Container are used with --sdm conda)
containers:
    qiime2: "docker://quay.io/qiime2/qiime2:2026.7"
    fastqc: "docker://staphb/fastqc:0.12.1"
    trimmomatic: "docker://staphb/trimmomatic:0.40"
    multiqc: "docker://multiqc/multiqc:v1.35"

# Trimmomatic (quality trimming of the raw reads)
trimmomatic:
    trimmer: "LEADING:2 TRAILING:2 SLIDINGWINDOW:4:2 MINLEN:25"
    extra: ""
    threads: 4

primer:
    # primers for 16S "V3-V4" regions (341F / 805R, Klindworth et al. 2013)
    primerF: CCTACGGGNGGCWGCAG
    primerR: GACTACHVGGGTATCTAATCC
    # cutadapt error rate and minimum overlap
    primer_err: 0.1
    primer_overlap: 3
    threads: 4

# Dada2
dada2:
    truncation_err: 2
    truncation_len-f: 229
    truncation_len-r: 229
    trim-left-f: 0
    trim-left-r: 0
    quality_err-f: 2
    quality_err-r: 2
    seqlenth: 400 # IMPORTANT parameter corresponding to the minimum length of merged reads to keep
    training: 1000000 # number of reads used to train the error model (default: 1000000)
    # "consensus" or "none". The former "pooled" method was removed from
    # QIIME 2 in release 2025.4 (q2-dada2 bug fix #171): "consensus" is the
    # DADA2 and QIIME 2 default.
    chimera: consensus
    threads: 12

# Taxonomy
taxonomy:
    # Pre-trained naive Bayes classifier for QIIME 2 2026.7 (SILVA 144),
    # V3-V4 region (341f-806r), habitat-weighted "animal distal gut",
    # downloaded from (see 01_Reference/README.md)
    # https://www.arb-silva.de/current-release/QIIME2/2026.7/SSU/V3V4-341f-806r/weighted/animal-distal-gut
    # Keep the SILVA file name. The weighted classifiers have 8 ranks:
    # domain, kingdom, phylum, class, order, family, genus, species
    # (level 7 = genus, level 8 = species). SILVA species are uncurated
    # organism names: treat them as tentative. Needs ~24-32 GB of RAM and
    # ~40 GB of free space in the temporary directory (tmpdir).
    classifier: "01_Reference/SILVA_144_SSURef_NR99_weighted_classifier_V3V4-341f-806r_animal-distal-gut.qza"
    # Uniform classifier (genus level, ~2 GB RAM) used to cross-check the
    # genera of the weighted classifier, as recommended by SILVA
    # (taxonomy_genus_check.tsv). "" = no check.
    check_classifier: "01_Reference/SILVA_144_SSURef_NR99_uniform_classifier_V3V4-341f-806r.qza"
    confidence: 0.7
    # Parallel jobs of classify-sklearn: each job holds its own copy of the
    # data, keep 1 with the weighted classifier (15.5 GB model)
    njobs: 1
    # ASVs classified per batch ("auto" = all at once): limits the memory
    reads_per_batch: 1000
    # Taxa removed from the feature table (comma-separated, case-insensitive)
    exclude: "d__Eukaryota"

# Phylogeny
phylogeny:
    # method to use to construct the tree (MUST BE fasttree or sepp)
    method: "sepp"
    # SEPP reference database (QIIME 2 artifact, see 01_Reference/README.md;
    # not a SILVA ARB file)
    seppdb: "01_Reference/sepp-refs-silva-128.qza"
    threads: 10

# Diversity (each comparison)
diversity:
    mindepth: 10
    # Axis limit (largest depth) of the alpha rarefaction curves only (no
    # effect on the other analyses): about the median frequency per sample
    # of 05_phylogeny/undernutrition-taxa-table-filtered-tree-sepp-dada2.qzv.
    # Samples with fewer reads drop out of the curves beyond their depth.
    maxdepth: 64500
    # Rarefaction depth: see the alpha rarefaction curves (when the alpha
    # diversity stabilises) and the feature table summary (samples below
    # this depth are removed from the diversity and abundance analyses)
    samplingdepth: 7500
    # Seed of the rarefaction of core-metrics (same results when rerun);
    # null = random seed (behaviour of the previous workflow)
    random_seed: 1234
    threads: 4
    alpha_metrics: ["shannon", "observed_features", "evenness", "faith_pd"]
    beta_metrics: ["jaccard", "bray_curtis", "unweighted_unifrac", "weighted_unifrac"]
    permutations: 999

# Differential abundance (each comparison)
differential_abundance:
    # taxonomic level of the collapsed table. SILVA 144: 7 = genus,
    # 8 = species (weighted classifiers only; equivalent to the former
    # level 7 of SILVA 138). See 05_Output/04_taxonomy/taxonomy_ranks.tsv
    taxa_level: 8
    # frequency filtering by group of samples ('filter_column' of
    # comparisons.tsv): a taxon is kept in a group if its frequency is
    # >= min_frequency and it is present in >= min_sample samples
    min_frequency: 50
    min_samples: 2

# Taxon abundance tables for MetaboAnalyst (each comparison)
metaboanalyst:
    # level-N.csv of the taxa bar plot. SILVA 144: 7 = genus, 8 = species
    # (weighted classifiers only; equivalent to the former level-7.csv of
    # SILVA 138). See 05_Output/04_taxonomy/taxonomy_ranks.tsv
    taxa_level: 8
    # relative abundance (proportion of the reads of the sample) or counts
    relative_abundance: true
    # remove the taxa absent from all the samples of the comparison
    drop_zero_taxa: true
    # keep only the taxa present in >= N samples of at least one group (0 = off)
    min_group_prevalence: 0
    # MetaboAnalyst reads comma-separated files with '.' as decimal mark
    sep: ","
    decimal: "."
